{% extends "base.html" %}

{% block title %}{{ t("login_title") }}{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header">
                <h2>{{ t("login_title") }}</h2>
            </div>

            <div class="card-body">

                <form method="POST" action="/login">

                    <div class="mb-3">

                        <label>
                            {{ t("email") }}
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="{{ t('email_placeholder') }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>
                            {{ t("password") }}
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        {{ t("sign_in") }}

                    </button>

                    <div class="mt-3 text-center">

                        <a href="/forgot-password">
                            {{ t("forgot_password") }}
                        </a>

                    </div>
                    
                    <!-- Separador entre login tradicional y Google -->
                    <div class="text-center my-3">
                        <span class="text-muted">o</span>
                    </div>
                    
                    <!-- Inicio de sesión con Google -->
                    <a href="/auth/google" class="btn w-100" style="background-color: white; color: black; border: 1px solid #ccc;">
                        {{ t("Use my Google account") }}
                    </a>
                    
                    </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
